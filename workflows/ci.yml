name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # All three analyzer tools are required, not optional, for the full
      # test suite to pass as written -- several tests assert exact
      # cppcheck/javac/ESLint output (specific rule ids, severities), not
      # just the "analyzer unavailable" graceful-degradation path.
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Install the standalone ESLint tooling used by javascript_analyzer.py
        working-directory: backend/tools/js-lint
        run: npm install

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v
        # Runs against an isolated in-memory SQLite database and fakeredis
        # with Celery in eager mode (see backend/tests/conftest.py) --
        # no Postgres, Redis, or worker process needed in CI.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
