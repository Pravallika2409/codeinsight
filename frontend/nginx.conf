server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container (see docker-compose.yml's
    # service name "backend") -- mirrors vite.config.js's dev-server proxy
    # so the frontend code never needs to know whether it's running via
    # `npm run dev` or this container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-API, non-file route serves index.html so
    # React Router's client-side routes (e.g. /projects, /history) work on
    # a hard refresh or direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
